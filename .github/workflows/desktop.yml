name: Desktop app

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # only used to publish releases for v* tags

jobs:
  build-macos:
    name: Build macOS app (arm64)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      ELECTROBUN_VERSION: 2.0.4
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: |
          bun run typecheck

      # Electrobun 2 builds through Hutch (downloaded by the `electrobun` npm bootstrap into ~/.hutch).
      - name: Cache Hutch toolchain
        uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ runner.arch }}-${{ env.ELECTROBUN_VERSION }}-${{ hashFiles('hutch.config.ts') }}

      - name: Typecheck desktop
        run: |
          bun run typecheck:desktop

      - name: Build app
        run: npx -y electrobun@${ELECTROBUN_VERSION} build --env=stable

      - name: Package
        id: package
        env:
          # For PRs use the branch and head commit, not GitHub's synthetic merge ref.
          REF: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          name="IssueKiller-macos-arm64-${REF//\//-}-${SHA:0:7}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] && name="IssueKiller-macos-arm64-${GITHUB_REF_NAME}"
          mkdir -p dist
          # ditto keeps the bundle's symlinks, permissions and extended attributes intact.
          ditto -c -k --keepParent "build/stable-macos-arm64/Issue Killer.app" "dist/${name}.zip"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}.zip
          retention-days: 30

      - name: Publish release (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/${{ steps.package.outputs.name }}.zip" \
            --title "Issue Killer $GITHUB_REF_NAME" \
            --notes "macOS (Apple silicon) build. Unsigned: after unzipping run \`xattr -dr com.apple.quarantine \"Issue Killer.app\"\` (or right-click → Open) before the first launch."
